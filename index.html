
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Website Launch</title>
    <meta name="description" content="Something exciting is coming soon. Stay connected with us.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #ffffff;
            background:
                linear-gradient(135deg, rgba(12, 29, 54, 0.96),
                rgba(25, 70, 105, 0.88)),
                #10253f;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            padding: 55px 30px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 55px;
        }

        .tagline {
            color: #d6b36a;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        h1 {
            font-size: clamp(42px, 8vw, 76px);
            line-height: 1.08;
            margin-bottom: 24px;
        }

        h1 span {
            color: #d6b36a;
        }

        .description {
            font-size: 17px;
            line-height: 1.8;
            color: #e0e7ef;
            max-width: 540px;
            margin: 0 auto 35px;
        }

        .button {
            display: inline-block;
            background: #d6b36a;
            color: #10253f;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .button:hover {
            background: #ffffff;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 70px;
            color: #bdc9d8;
            font-size: 12px;
            line-height: 1.8;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 10px;
            }

            .logo {
                margin-bottom: 45px;
            }

            .description {
                font-size: 15px;
            }

            .footer {
                margin-top: 50px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="logo">YOUR BRAND</div>

        <p class="tagline">Something Extraordinary</p>

        <h1>We're <span>Coming Soon.</span></h1>

        <p class="description">
            We're working on something exciting.
            A new experience is on its way.
            Stay connected and be among the first to discover it.
        </p>

        <a class="button"
           href="mailto:info@example.com?subject=Coming%20Soon%20Enquiry">
            Contact Us
        </a>

        <div class="footer">
            © <span id="year"></span> Your Brand. All rights reserved.
        </div>
    </main>

    <script>
        document.getElementById("year").textContent =
            new Date().getFullYear();
    </script>
</body>
</html>
